<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're subscribed | Archflow</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Confirmation target for the joinbox signup form.
       This loads INSIDE the 220px iframe on the landing page, sitting on that
       panel's #111827 ground - so the palette is hardcoded dark rather than
       theme-aware, exactly like the panel itself. It also has to hold up if
       someone opens the URL directly, hence the centred flex layout. */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #111827;
      color: #C3CCD9;
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 420px; }
    .check {
      width: 44px;
      height: 44px;
      margin: 0 auto 14px;
      border-radius: 999px;
      background: rgba(45, 212, 191, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check svg { width: 24px; height: 24px; stroke: #2DD4BF; }
    h1 {
      font-family: 'Outfit', system-ui, sans-serif;
      font-weight: 700;
      font-size: 22px;
      line-height: 1.25;
      color: #F8FAFC;
      margin: 0 0 8px;
    }
    p { margin: 0; font-size: 15px; line-height: 1.55; color: #C3CCD9; }
    .home {
      display: inline-block;
      margin-top: 16px;
      font-size: 14px;
      color: #2DD4BF;
      text-decoration: none;
      border-bottom: 1px solid rgba(45, 212, 191, 0.35);
      padding-bottom: 1px;
    }
    .home:hover { border-bottom-color: #2DD4BF; }
    /* Standalone view gets more room to breathe than the iframe does. */
    @media (min-height: 420px) {
      .check { width: 56px; height: 56px; margin-bottom: 20px; }
      .check svg { width: 30px; height: 30px; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 12.75l6 6 9-13.5" />
      </svg>
    </div>
    <h1>You&rsquo;re subscribed.</h1>
    <p>
      The next release note will land in your inbox.
    </p>
    <!-- target="_top" so the link escapes the iframe instead of loading the
         landing page inside a 220px frame. -->
    <a class="home" href="https://archflowai.dev" target="_top">Back to archflowai.dev</a>
  </div>
</body>
</html>
