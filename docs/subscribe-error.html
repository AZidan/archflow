<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup didn't go through — Archflow</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Failure target for the joinbox signup form. Mirrors subscribed.html: loads
       inside the 220px iframe on the landing page, so the palette is hardcoded
       dark to match that panel's #111827 ground rather than following the theme.
       Amber rather than red - a failed newsletter signup is a retry, not a fault. */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #111827;
      color: #C3CCD9;
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 440px; }
    .icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 14px;
      border-radius: 999px;
      background: rgba(251, 191, 36, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 24px; height: 24px; stroke: #FBBF24; }
    h1 {
      font-family: 'Outfit', system-ui, sans-serif;
      font-weight: 700;
      font-size: 22px;
      line-height: 1.25;
      color: #F8FAFC;
      margin: 0 0 8px;
    }
    p { margin: 0; font-size: 15px; line-height: 1.55; color: #C3CCD9; }
    .actions {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 14px;
    }
    .actions a { text-decoration: none; }
    .retry {
      color: #2DD4BF;
      border-bottom: 1px solid rgba(45, 212, 191, 0.35);
      padding-bottom: 1px;
    }
    .retry:hover { border-bottom-color: #2DD4BF; }
    .sep { color: #4B5563; }
    .alt {
      color: #97A3B4;
      border-bottom: 1px solid rgba(151, 163, 180, 0.28);
      padding-bottom: 1px;
    }
    .alt:hover { color: #C3CCD9; border-bottom-color: rgba(151, 163, 180, 0.6); }
    /* Standalone view gets more room to breathe than the iframe does. */
    @media (min-height: 420px) {
      .icon { width: 56px; height: 56px; margin-bottom: 20px; }
      .icon svg { width: 30px; height: 30px; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 9v4" />
        <path d="M12 17h.01" />
        <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
      </svg>
    </div>
    <h1>That didn&rsquo;t go through.</h1>
    <p>
      The signup failed on our end &mdash; your email wasn&rsquo;t saved.
    </p>
    <!-- target="_top" so these escape the iframe rather than loading a full page
         inside a 220px frame. The GitHub route is a genuine alternative: watching
         releases there delivers the same thing this list does. -->
    <div class="actions">
      <a class="retry" href="https://archflowai.dev/#install" target="_top">Try again</a>
      <span class="sep" aria-hidden="true">&middot;</span>
      <a class="alt" href="https://github.com/AZidan/archflow/releases" target="_top">Watch releases on GitHub instead</a>
    </div>
  </div>
</body>
</html>
