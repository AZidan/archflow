  - id: S7-05
    title: "Gemini $HOME path and Cursor workspace-root fixes"
    priority: High
    status: done
    gates: {needs_design: false, needs_contract: false}
    assigned: api-engineer
    description: >-
      Gemini commands quoted "~/.gemini/..." which the shell does not expand; now $HOME. Cursor hook
      bridge falls back to the first workspace root since Cursor sends no cwd. VERIFICATION PLAN
      (2026-09-23): the run verifies both with automated tests — Gemini command paths expand under a
      real shell, and cursor-bridge.mjs resolves the project from a recorded no-cwd payload with
      workspace_roots. The gemini CLI is installed on this machine; Cursor is not. Autopilot must not
      install the adapter into ~/.gemini or any other global host config. The live on-host check of
      both is the user's, after the run; do not park the story for it.
    acceptance_criteria:
      - {text: "Gemini /archflow:doctor resolves the plugin path (automated test; live check by user)", met: true}
      - {text: "Cursor hooks find the project without cwd (automated test; live check by user)", met: true}
