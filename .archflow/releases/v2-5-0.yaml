  - id: S5-02
    title: "Resume parked work after an autopilot run finishes"
    priority: High
    status: spec_ready
    gates: {needs_design: false, needs_contract: false}
    assigned: api-engineer
    description: >-
      Added 2026-10-10 (user: fix in this release), found by S2-06 QA. `/archflow:autopilot resume`
      only reads the newest ledger whose status is preflight or running (autopilot.md:284), but a run
      that empties its queue is set `finished` (autopilot.md:253) while its end-of-run report still
      says "answer the parked questions, then /archflow:autopilot resume" (autopilot.md:245). Parked
      stories left by a finished run therefore have no sanctioned way back. Status (S2-06, case 3)
      gives the same advice, so it must stay true after this change.
    acceptance_criteria:
      - {text: "After a run finishes with parked stories, there is one documented command that picks them up once their questions are answered", met: false}
      - {text: "The end-of-run report's 'Next:' line names a command that actually works for a finished run", met: false}
      - {text: "/archflow:status's parked-story advice matches the real resume path", met: false}
      - {text: "A run with no parked stories is not resurrected by resume; aborted runs stay aborted", met: false}
      - {text: "Tests cover resume on a finished run with parked stories, one without, and an aborted run", met: false}
      - {text: "CHANGELOG has a Fixed entry", met: false}
    subtasks:
      - {text: "Decide and document how resume treats a finished run with parked stories (autopilot.md)", completed: false}
      - {text: "Fix the end-of-run report's Next line", completed: false}
      - {text: "Align status.md's parked case (plugin/commands/status.md) and regenerate adapters", completed: false}
      - {text: "Tests + CHANGELOG", completed: false}

