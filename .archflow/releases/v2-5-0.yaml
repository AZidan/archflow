  - id: S7-05
    title: "Gemini $HOME path and Cursor workspace-root fixes"
    priority: High
    status: in_progress
    gates: {needs_design: false, needs_contract: false}
    assigned: api-engineer
    description: >-
      Gemini commands quoted "~/.gemini/..." which the shell does not expand; now $HOME. Cursor hook
      bridge falls back to the first workspace root since Cursor sends no cwd. VERIFICATION PLAN
      (2026-09-23): the run verifies both with automated tests — Gemini command paths expand under a
      real shell, and cursor-bridge.mjs resolves the project from a recorded no-cwd payload with
      workspace_roots. The gemini CLI is installed on this machine; Cursor is not. Autopilot must not
      install the adapter into ~/.gemini or any other global host config. The live on-host check of
      both is the user's, after the run; do not park the story for it.
    acceptance_criteria:
      - {text: "Gemini /archflow:doctor resolves the plugin path (automated test; live check by user)", met: false}
      - {text: "Cursor hooks find the project without cwd (automated test; live check by user)", met: false}
    subtasks:
      - {text: "Fix Gemini command paths", completed: true}
      - {text: "Cursor bridge fallback", completed: true}
      - {text: "Automated tests for both fixes", completed: false}
      - {text: "Live verification on Gemini CLI and Cursor (user, after the run)", completed: false}
  - id: S9-04
    title: "Studio-first site repositioning"
    priority: High
    status: in_progress
    gates: {needs_design: false, needs_contract: false}
    assigned: ui-engineer
    description: >-
      Branch site/studio-first. DECISION (user, 2026-09-23): design gate removed; docs/index-next.html
      becomes the homepage (replaces docs/index.html; index-next.html is deleted). Marketing review done
      2026-09-23 against .claude/skills/archflow-marketing guardrails; the mechanical fixes are
      subtasks below. OPEN QUESTIONS for the autopilot interview (do not guess them): (Q1) the banner
      "Archflow Studio now runs on every supported coding agent" and the hero's "drives your own
      terminal session on Codex, Copilot CLI, Cursor, Gemini CLI and OpenCode" — CHANGELOG 2.4.0 says
      Studio stays Claude Code only and backlog S6-04 is unbuilt; is multi-host Studio shipped? If not,
      the banner and hero must say Claude Code only. (Q2) "Free while in beta" (hero badge + meta
      description) implies a future paid Studio, against the pricing-silence guardrail; keep, or say
      "Beta" only? (Q3) "Codex is next, then OpenCode, then the rest" is a public roadmap commitment;
      keep or drop the ordering? (Q4) the proof numbers — 5 production codebases, 250+ stories, 6
      months, "Studio ships Studio: 8 releases and 71 stories" — are they current?
    acceptance_criteria:
