# Active release. Stories reflect uncommitted work in the tree at onboarding (2026-09-23).
# Decisions recorded 2026-09-23 (user, before the autopilot run) are marked "DECISION" in each story.
id: v2-5-0
name: "2.5.0"
goal: "Telemetry on every host with a one-command opt-out, adapter build and host fixes, and the Studio-first site repositioning."
status: in_progress
release_criteria:
  - {text: "Telemetry policy decided and ADR 003 superseded or amended (S8-07) before this release ships", met: false}
  - {text: "SECURITY.md and CHANGELOG describe the shipped telemetry behavior exactly", met: false}
  - {text: "Adapters regenerate with no drift (build-adapters.mjs --check passes)", met: false}
stories:
  - id: S8-07
    title: "Record telemetry policy: on by default (opt-out), framework-wide"
    priority: Critical
    status: review
    gates: {needs_design: false, needs_contract: false}
    assigned: api-engineer
    description: >-
      DECISION (user, 2026-09-23): telemetry is ON BY DEFAULT (opt-out) on every host, framework-wide,
      not opt-in and not Studio-only. This supersedes ADR 003's proposal. Remaining work is recording
      it: a superseding ADR, and SECURITY.md + CHANGELOG aligned in the same change. NOTE: ADRs live in
      docs/internal/decisions/, which is a symlink into the separate archflow-internal repo; commits
      to it do not land on this repo's run branch. Write the ADR there, leave it uncommitted for the
      user, and say so in the report. Runs before S8-05.
    acceptance_criteria:
      - {text: "A new ADR records opt-out, framework-wide telemetry (scope, event allow-list, DO_NOT_TRACK/CI disable, notice, opt-out command) and marks ADR 003 superseded", met: false}
      - {text: "SECURITY.md states that anonymous telemetry is on by default, what is sent, what is never sent, and how to turn it off", met: false}
      - {text: "CHANGELOG [Unreleased] describes the same default and opt-out", met: false}
    subtasks:
      - {text: "Write superseding ADR in docs/internal/decisions/ (uncommitted, other repo)", completed: false}
      - {text: "Set ADR 003 status to Superseded", completed: false}
      - {text: "Align SECURITY.md and CHANGELOG", completed: false}
    issues:
      - id: I-1
        summary: "SECURITY.md/CHANGELOG list fewer event properties than ADR 005 and the code, and imply cli_install carries project type/phase/mode"
        found_by: qa-engineer
        severity: minor
        location: "SECURITY.md:88"
        report: "docs/qa-reports/S8-07-qa.md"
        status: fixed
      - id: I-2
        summary: "SECURITY.md says telemetry is 'the only thing it sends anywhere', but the upgrade check and installer make outbound GitHub requests"
        found_by: qa-engineer
        severity: minor
        location: "SECURITY.md:4"
        report: "docs/qa-reports/S8-07-qa.md"
        status: fixed
      - id: I-3
        summary: "SECURITY.md says cli_install carries 'only' hosts and source, but every event also sends entrypoint, via_studio, studio_capture; studio_capture is undocumented"
        found_by: code-reviewer
        severity: blocking
        location: "SECURITY.md:94"
        report: "docs/qa-reports/S8-07-code-review.md"
        status: fixed
      - id: I-4
        summary: "SECURITY.md 'sends no project data anywhere' contradicts project_type/phase/mode/has_project in the payload"
        found_by: code-reviewer
        severity: minor
        location: "SECURITY.md:4"
        report: "docs/qa-reports/S8-07-code-review.md"
        status: fixed
      - id: I-5
        summary: "SECURITY.md says telemetry is off whenever CI is set, but CI/DO_NOT_TRACK of 0/false/no/off leave it on"
        found_by: code-reviewer
        severity: minor
        location: "SECURITY.md:106"
        report: "docs/qa-reports/S8-07-code-review.md"
        status: fixed
      - id: I-6
        summary: "ADR 005 says only notice-printing code records noticeShownAt, but setConsent also sets it"
        found_by: code-reviewer
        severity: minor
        location: "docs/internal/decisions/005-framework-telemetry-opt-out.md:98"
        report: "docs/qa-reports/S8-07-code-review.md"
        status: fixed
  - id: S8-05
    title: "Framework-wide anonymous telemetry"
    priority: Critical
    status: in_progress
    gates: {needs_design: false, needs_contract: false}
    assigned: api-engineer
    description: >-
      session_start, command_run (command name only) and cli_install events on every host, carrying
      host, entrypoint, Studio, project type, version, phase and mode; never names, paths, contents,
      prompts or arguments. DECISION (user, 2026-09-23): on by default (opt-out) — see S8-07; the
      ADR 003 blocker is resolved. Work is uncommitted in plugin/hooks/telemetry.mjs, plugin/lib/,
      adapters/*/telemetry.mjs.
    acceptance_criteria:
      - {text: "No event carries project names, paths, file contents, prompts or arguments", met: false}
      - {text: "DO_NOT_TRACK and CI disable telemetry and send nothing", met: false}
      - {text: "Telemetry is on by default (opt-out) on every host, per S8-07", met: false}
      - {text: "A one-time notice announces telemetry", met: false}
    subtasks:
      - {text: "Telemetry hook and shared lib", completed: true}
      - {text: "Per-host command detection", completed: true}
      - {text: "Verify the default is on (opt-out) on every host", completed: false}
      - {text: "Tests for event allow-list", completed: false}
