      - {text: "No credentials or absolute home paths in shipped files", met: true}
      - {text: "External installs pinned to a tag or commit", met: true}
      - {text: "SECURITY.md covers pinning, untrusted content, shell surface and reporting", met: true}
    subtasks:
      - {text: "Add test-accounts.example.yaml", completed: true}
      - {text: "Pin codemap and superdesign", completed: true}
      - {text: "Write SECURITY.md", completed: true}
