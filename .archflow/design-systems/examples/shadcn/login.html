<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>shadcn/ui — Login</title><link rel="stylesheet" href="theme.css"></head><body>
<div style="height:800px;display:grid;place-items:center;background:var(--muted)">
  <div style="width:384px">
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px">
      <div style="width:28px;height:28px;border-radius:6px;background:var(--primary);
           color:var(--primary-foreground);display:grid;place-items:center">
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></div>
      <span style="font-weight:600;font-size:16px;letter-spacing:-.2px">Fieldnote</span>
    </div>
    <div class="card">
      <div class="card-header">
        <h1 class="h1">Login</h1>
        <p class="small muted">Enter your email below to sign in to your account.</p>
      </div>
      <div class="card-content">
        <div style="margin-bottom:16px">
          <label class="label">Email</label>
          <input class="input" value="rowan@fieldnote.app">
        </div>
        <div style="margin-bottom:20px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <label class="label" style="margin:0">Password</label>
            <a class="xs" style="text-decoration:underline;color:var(--foreground)">Forgot your password?</a>
          </div>
          <input class="input" type="password" value="············">
        </div>
        <button class="btn btn-default btn-full">Login</button>
        <div style="position:relative;margin:24px 0;text-align:center">
          <div class="sep" style="position:absolute;top:50%;left:0"></div>
          <span class="xs muted" style="position:relative;background:var(--card);padding:0 8px;
            text-transform:uppercase;letter-spacing:.4px">Or continue with</span>
        </div>
        <button class="btn btn-outline btn-full">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>
          GitHub</button>
      </div>
      <div class="card-footer" style="justify-content:center">
        <span class="small muted">Don't have an account?</span>
        <a class="small" style="text-decoration:underline">Sign up</a>
      </div>
    </div>
    <p class="xs muted" style="text-align:center;margin-top:20px;line-height:16px">
      By clicking continue, you agree to our <span style="text-decoration:underline">Terms of Service</span>
      and <span style="text-decoration:underline">Privacy Policy</span>.</p>
  </div>
</div></body></html>
