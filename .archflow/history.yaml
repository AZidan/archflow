# Shipped-story intent layer (history-schema.yaml). Backfilled at onboarding 2026-09-23
# from CHANGELOG.md; `touched` omitted because it is captured from tag-to-tag diffs at ship.
- story: S1-01
  release: v1-x
  version: v1.2.8
  shipped_at: "2026-03-30"
  summary: "Phase-based framework (v1) - Pre-v2 Archflow: product phases with sprints, phase files loaded per phase, specialized agents and mandatory approval gates"
  acceptance_criteria:
    - "Phase files load per current phase from current-phase.yaml"
    - "Roadmap tracks phases and sprints with required story status"
  archive: releases/archive/v1-x.yaml
- story: S1-02
  release: v2-0
  version: v2.0.2
  shipped_at: "2026-08-17"
  summary: "Schema v2.0: releases as the outer loop - roadmap.yaml became a small index; detailed stories live in releases/{slug}.yaml, unscheduled scope in backlog.yaml, shipped intent in history.yaml"
  acceptance_criteria:
    - "roadmap.yaml holds only project meta, epic labels, the release pipeline and the shipped ledger"
    - "Stories live in exactly one of backlog.yaml, a release file, or releases/archive/"
    - "No phases: or sprints: keys remain in any schema"
  archive: releases/archive/v2-0.yaml
- story: S1-03
  release: v2-0
  version: v2.0.2
  shipped_at: "2026-08-17"
  summary: "Per-story readiness pipeline with gates - Story status is a readiness ladder (backlog -> spec_ready -> design_ready -> contract_ready -> ready -> in_progress -> review -> done) with needs_design / needs_contract gates derived from scope"
  acceptance_criteria:
    - "Stories carry gates {needs_design, needs_contract}"
    - "A gate set false is skipped in the ladder"
  archive: releases/archive/v2-0.yaml
