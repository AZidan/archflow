# =============================================================================
# Archflow RELEASE Schema — v2.0
# =============================================================================
# Canonical schema for a single release file:
#   .archflow/releases/{slug}.yaml         (active / planning / ready release)
#   .archflow/releases/archive/{slug}.yaml (shipped release — same shape, status: released)
#
# A release is the first-class OUTER LOOP unit (it replaced v1's product "phase";
# sprints are retired). It owns its fully-detailed stories inline. Backlog stubs
# are PROMOTED into a release file and fleshed out here.
#
# Related schemas:
#   .archflow/roadmap.yaml   -> roadmap-schema.yaml   (index; lists releases by ref)
#   .archflow/backlog.yaml   -> backlog-schema.yaml   (stub stories, pre-promotion)
#   .archflow/history.yaml   -> history-schema.yaml   (shipped-story intent layer)
# =============================================================================

# -----------------------------------------------------------------------------
# Release  (releases/{slug}.yaml and releases/archive/{slug}.yaml)
# -----------------------------------------------------------------------------
# Document root: `release`
$root: release

release:
  type: object
  required: [id, name, goal, status, stories]
  properties:
    id:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]*$"
      description: "Filesystem-safe slug; matches the release_ref id in the index."
      example: "checkout-redesign"
    name:
      type: string
      description: "Human display name the user typed; the slug `id` is derived from it."
      example: "Checkout Redesign"
    goal:
      type: string
      example: "Frictionless checkout with saved cards and one-tap pay"
    status:
      type: string
      enum: [planning, ready, in_progress, released]
      description: >
        Full release lifecycle:
          planning    — PM detailing (many allowed, concurrent)
          ready       — fully detailed, queued to build
          in_progress — being implemented (AT MOST ONE across the project)
          released    — shipped; appears only in releases/archive/
    version:
      type: string
      required: false
      description: "Set at ship time (git tag). Null/absent until released."
      example: "v1.4.0"
    released_at:
      type: string
      format: iso8601
      required: false
      description: "Set at ship time."
    release_criteria:
      type: array
      required: false
      description: "Optional release-level acceptance — releasable-when gates above the story level."
      items:
        $ref: "#/acceptance_criterion"
    stories:
      type: array
      description: "Fully-detailed stories that ship in this release (inline, not by ID reference)."
      items:
        $ref: "#/story"

# -----------------------------------------------------------------------------
# Story (detailed; lives in a release file)
# -----------------------------------------------------------------------------
story:
  type: object
  required: [id, title, priority, status, gates, assigned, description, acceptance_criteria, subtasks]
  properties:
    id:
      type: string
      pattern: "^S[0-9]+-[0-9]+[a-z]?$"
      description: "Epic-scoped (S{epic}-{seq}, optional letter suffix for split stories e.g. S1-03b); stable across promotion."
      example: "S2-07"
    title:
      type: string
      example: "Saved payment methods"
    priority:
      type: string
      enum: [Critical, High, Medium, Low]
    status:
      type: string
      enum: [backlog, spec_ready, design_ready, contract_ready, ready, in_progress, review, parked, done]
      description: >
        READINESS PIPELINE (Pillar 2), not a flat kanban column:
          backlog        — stub (only in backlog.yaml)
          spec_ready     — PM finalized scope + ACs; promoted into a release
          design_ready   — designer produced screens (skipped if not needs_design)
          contract_ready — architect specified endpoints (skipped if not needs_contract)
          ready          — all applicable upstream gates satisfied -> buildable
          in_progress    — engineer building
          review         — in QA / acceptance
          parked         — started, then stopped on an OPEN QUESTION only the human can
                           answer (see `parked`). Work-in-progress is committed on the
                           story's branch but unmerged. Set by /archflow-autopilot when a
                           run hits an undecided question; clears back to in_progress once
                           the question is answered. NOT a failure state and NOT a pause —
                           broken work stays in_progress.
          done           — complete
    gates:
      $ref: "#/gates"
    design_artifact:
      type: string
      required: false
      description: "Path to the designer's handoff for this story; present once design_ready."
      example: "design-artifacts/S2-07/"
    contract_endpoints:
      type: array
      required: false
      description: |
        Operation identifiers this story added to the API contract; present once contract_ready.
        The counterpart to design_artifact — a POINTER into docs/api-contract.md, never a copy of
        the endpoint definitions, which live in the contract and nowhere else. Written by
        /archflow-contract {story-id}. Lets a consumer draw the reverse edge from an endpoint back
        to the story that needed it.
      items: {type: string}
      example: ["listCartItems", "addCartItem"]
    assigned:
      type: string
      description: "Agent or role responsible for the current lane."
      example: "ui-engineer"
    description:
      type: string
      description: "Detailed description (multi-line YAML block scalar)."
    acceptance_criteria:
      type: array
      description: "Added on promotion from backlog (PM, at spec_ready)."
      items:
        $ref: "#/acceptance_criterion"
    subtasks:
      type: array
      items:
        $ref: "#/subtask"
    issues:
      type: array
      required: false
      description: |
        Review findings against THIS story, written by the agent that found them —
        qa-engineer, pm-reviewer, and any story_review optional agent. Absent or empty
        means none found. See "#/issue" for the lifecycle and the two invariants.
      items:
        $ref: "#/issue"
    pulled_from:
      type: string
      required: false
      description: "Origin annotation when a story was pulled into this release (`backlog` or a release id)."
      example: "backlog"
    parked:
      type: object
      required: false
      description: >
        Present when `status: parked`. The open question that stopped the story,
        stated so it can be answered in one read, with candidate answers so
        resuming is a single choice. Written by /archflow-autopilot; mirrored in
        the run ledger (autopilot-schema.yaml).
      properties:
        question:
          type: string
          example: "Do partial refunds need finance approval above $500?"
        context:
          type: string
          description: "What the human needs to know to decide, without reopening the code."
        options:
          type: array
          required: false
          description: "2-4 candidate answers."
          items: {type: string}
        blocks_release:
          type: boolean
          default: true
          description: >
            TRUE (the default) makes the Phase 5 ship ritual HALT on this story:
            a release does not ship with an unanswered product question inside it.
            Only the human may set it false — per story, when they answer, never
            silently at ship time and never by an agent.
        branch:
          type: string
          required: false
          description: "Branch holding the unmerged work-in-progress."
        at: {type: string, format: iso8601}
        by:
          type: string
          required: false
          description: "Who/what parked it, e.g. an autopilot run id."
          example: "autopilot:2026-08-24-1"

    started_ungated:
      type: object
      required: false
      description: >
        Advisory-recorded override stamp (full mode). Written when a story is built
        before an applicable gate was satisfied — the human kept control, the skip
        is recorded so review/QA can catch it.
      properties:
        gate:   {type: string, enum: [design, contract], description: "Which gate was skipped"}
        by:     {type: string, description: "Role/agent that overrode"}
        reason: {type: string}
        at:     {type: string, format: iso8601}

# -----------------------------------------------------------------------------
# Gates (which upstream readiness gates apply to a story)
# -----------------------------------------------------------------------------
gates:
  type: object
  required: [needs_design, needs_contract]
  description: >
    Derived from scope: frontend work -> needs_design; new/changed endpoints ->
    needs_contract. A gate set false is skipped in the readiness pipeline.
  properties:
    needs_design:   {type: boolean, default: false}
    needs_contract: {type: boolean, default: false}

# -----------------------------------------------------------------------------
# Acceptance Criterion  (used by story.acceptance_criteria and release.release_criteria)
# -----------------------------------------------------------------------------
acceptance_criterion:
  type: object
  required: [text, met]
  properties:
    text:
      type: string
      example: "User can pay with a saved card"
    met:
      type: boolean
      default: false
    verified_by:
      type: string
      required: false
      enum: [pm-reviewer, qa-engineer, manual]
    verified_at:
      type: string
      format: iso8601
      required: false

# -----------------------------------------------------------------------------
# Issue  (story.issues[])
# -----------------------------------------------------------------------------
# A defect found while REVIEWING a story, born inside that story's build loop and
# resolved before the story is done. It is not a bug tracker: no assignee, no
# comments, no age, three states.
#
# Two invariants, checked by validate_archflow.py because the schema dialect
# cannot express either:
#   1. A story may not be `status: done` while it holds an open blocking issue.
#   2. `status: deferred` requires `deferred_to`.
#
# Distinctions that keep this from duplicating fields the story already has:
#   acceptance_criterion — a condition that must hold, authored by the PM BEFORE
#                          the build. A failing one is `met: false`.
#   subtask              — planned scope. An issue is what the plan got wrong.
#   parked               — an UNDECIDED question for the human. An issue is
#                          BROKEN work for an agent.
# -----------------------------------------------------------------------------
issue:
  type: object
  required: [id, summary, found_by, severity, status]
  properties:
    id:
      type: string
      pattern: "^I-[0-9]+$"
      description: "Story-scoped and sequential; next = highest existing + 1."
      example: "I-1"
    summary:
      type: string
      description: "One line that identifies the defect. The evidence lives in `report`."
      example: "Saved-card selector renders empty on a 204 response"
    found_by:
      type: string
      enum: [qa-engineer, pm-reviewer, code-reviewer, a11y-expert, performance-optimizer, human]
      description: "The reviewer that found it. A reviewer never closes its own finding."
    severity:
      type: string
      enum: [blocking, minor]
      description: >
        blocking — the story cannot be done until it is fixed.
        minor    — may be deferred to the backlog, by the USER only. An agent may
                   never downgrade or defer its own finding.
    location:
      type: string
      required: false
      description: "file:line, or the endpoint / screen the defect is in."
      example: "frontend/src/checkout/SavedCards.tsx:42"
    report:
      type: string
      required: false
      description: |
        POINTER to the report that already carries the repro, the expected-vs-actual and
        the evidence — never a copy of it. Same discipline as `contract_endpoints`.
      example: "docs/qa-reports/S2-07-qa.md"
    status:
      type: string
      enum: [open, fixed, deferred]
      description: >
        open     — found, not yet fixed
        fixed    — set by the implementation agent in the same edit that lands the fix
        deferred — moved to the backlog; requires `deferred_to`. Kept as a tombstone so a
                   reviewer can see the finding was dispositioned rather than missed
    deferred_to:
      type: [string, "null"]
      required: false
      description: "Backlog stub id this finding moved into. REQUIRED when status is deferred."
      example: "S2-19"
    at:
      type: string
      format: iso8601
      required: false

# -----------------------------------------------------------------------------
# Subtask
# -----------------------------------------------------------------------------
subtask:
  type: object
  required: [text, completed]
  properties:
    text:      {type: string, example: "Build saved-card selector"}
    completed: {type: boolean, default: false}

# =============================================================================
# Example — releases/checkout-redesign.yaml
# =============================================================================
# id: checkout-redesign
# name: "Checkout Redesign"
# goal: "Frictionless checkout with saved cards and one-tap pay"
# status: in_progress
# version: null
# release_criteria:
#   - {text: "Checkout completion rate >= 80% in staging", met: false}
# stories:
#   - id: S2-07
#     title: "Saved payment methods"
#     priority: High
#     status: design_ready
#     gates: {needs_design: true, needs_contract: true}
#     design_artifact: design-artifacts/S2-07/
#     contract_endpoints: [listCartItems, addCartItem]
#     assigned: ui-engineer
#     description: >
#       Let users store and reuse cards during checkout.
#     acceptance_criteria:
#       - {text: "User can pay with a saved card", met: false}
#     subtasks:
#       - {text: "Build saved-card selector", completed: false}
#     issues:
#       - id: I-1
#         summary: "Saved-card selector renders empty on a 204 response"
#         found_by: qa-engineer
#         severity: blocking
#         location: "frontend/src/checkout/SavedCards.tsx:42"
#         report: "docs/qa-reports/S2-07-qa.md"
#         status: open
#     pulled_from: backlog
