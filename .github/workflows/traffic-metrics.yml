name: Traffic metrics

# GitHub keeps only 14 days of traffic data. Snapshot it daily so clone counts
# (the closest proxy we have to plugin installs) survive as a permanent series.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-metrics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch traffic stats
        env:
          # The default GITHUB_TOKEN cannot read the traffic API — it needs a
          # token with push access (classic: repo, fine-grained: Administration read).
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: .github/scripts/traffic-snapshot.sh

      - name: Commit changes
        run: |
          if git diff --quiet -- metrics; then
            echo "No traffic changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git commit -m "chore(metrics): traffic snapshot $(date -u +%F)"
          git push
